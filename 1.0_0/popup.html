<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>InstaSpeed</title>
  <style>
    * { box-sizing: border-box; }

    body {
      width: 340px;
      padding: 22px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: linear-gradient(160deg, #1e1b4b 0%, #312e81 45%, #4c1d95 100%);
      color: white;
      position: relative;
      overflow: hidden;
    }

    /* Animated ambient glow blobs (pure decoration, no markup needed) */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 220px; height: 220px;
      background: #818cf8;
      top: -80px; right: -60px;
      animation: drift 9s ease-in-out infinite alternate;
    }
    body::after {
      width: 200px; height: 200px;
      background: #ec4899;
      bottom: -90px; left: -70px;
      animation: drift 11s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(-25px, 20px) scale(1.15); }
    }

    h1 {
      font-size: 26px;
      margin: 0 0 10px 0;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff, #c4b5fd, #f9a8d4, #ffffff);
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
      position: relative;
      z-index: 1;
    }

    @keyframes shine {
      to { background-position: 250% center; }
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .speed-options {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 1;
    }

    .speed-option {
      display: flex;
      align-items: center;
      padding: 12px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 2px solid transparent;
    }

    .speed-option:last-child {
      margin-bottom: 0;
    }

    .speed-option:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateX(4px);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .speed-option.active {
      background: linear-gradient(135deg, rgba(129, 140, 248, 0.35), rgba(236, 72, 153, 0.25));
      border-color: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 18px rgba(129, 140, 248, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Custom glowing radio */
    .speed-option input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      margin-right: 12px;
      cursor: pointer;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }

    .speed-option input[type="radio"]:hover {
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .speed-option input[type="radio"]:checked {
      border-color: #ffffff;
      background: radial-gradient(circle, #ffffff 42%, transparent 48%);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
    }

    .speed-label {
      display: flex;
      flex-direction: column;
      flex: 1;
      cursor: pointer;
    }

    .speed-value {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
      letter-spacing: 0.3px;
    }

    /* Color-code speeds from calm to fast */
    .speed-option[data-speed="1"] .speed-value    { color: #a7f3d0; }
    .speed-option[data-speed="1.25"] .speed-value { color: #bae6fd; }
    .speed-option[data-speed="1.5"] .speed-value  { color: #c4b5fd; }
    .speed-option[data-speed="1.75"] .speed-value { color: #f9a8d4; }
    .speed-option[data-speed="2"] .speed-value    { color: #fda4af; }

    .speed-description {
      font-size: 12px;
      opacity: 0.65;
    }

    .status {
      margin-top: 15px;
      padding: 11px;
      background: rgba(34, 197, 94, 0.18);
      border: 1px solid rgba(74, 222, 128, 0.4);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      z-index: 1;
    }

    .status.show {
      opacity: 1;
      transform: translateY(0);
    }

    .permission-button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      background: linear-gradient(135deg, #ffffff 0%, #ede9fe 100%);
      color: #5b21b6;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    /* Shine sweep on hover */
    .permission-button::after {
      content: '';
      position: absolute;
      top: 0; left: -75%;
      width: 50%; height: 100%;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.6), transparent);
      transform: skewX(-20deg);
      transition: left 0.5s ease;
    }

    .permission-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(129, 140, 248, 0.45);
    }

    .permission-button:hover::after {
      left: 125%;
    }

    .permission-button.granted {
      background: linear-gradient(135deg, #34d399, #059669);
      color: white;
      cursor: default;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
    }

    .permission-button.granted::after { display: none; }

    .permission-button.granted:hover {
      transform: none;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      opacity: 0.6;
      letter-spacing: 0.4px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <h1>INSTAGRAM FAST 🤩🤩</h1>
  <div class="subtitle">SPEED CHOOSE KR</div>
  
  <div class="speed-options">
    <div class="speed-option" data-speed="1">
      <input type="radio" name="speed" value="1" id="speed1">
      <label class="speed-label" for="speed1">
        <span class="speed-value">1.0x </span>
        <span class="speed-description">START</span>
      </label>
    </div>
    
    <div class="speed-option" data-speed="1.25">
      <input type="radio" name="speed" value="1.25" id="speed125">
      <label class="speed-label" for="speed125">
        <span class="speed-value">1.25x </span>
        <span class="speed-description">THODA FAST</span>
      </label>
    </div>
    
    <div class="speed-option" data-speed="1.5">
      <input type="radio" name="speed" value="1.5" id="speed15">
      <label class="speed-label" for="speed15">
        <span class="speed-value">1.5x </span>
        <span class="speed-description">THODA AUR FAST</span>
      </label>
    </div>

    <div class="speed-option" data-speed="1.75">
      <input type="radio" name="speed" value="1.75" id="speed175">
      <label class="speed-label" for="speed175">
        <span class="speed-value">1.75x </span>
        <span class="speed-description">AVG FAST</span>
      </label>
    </div>

    <div class="speed-option" data-speed="2">
      <input type="radio" name="speed" value="2" id="speed2">
      <label class="speed-label" for="speed2">
        <span class="speed-value">2.0x </span>
        <span class="speed-description">DOOMSCROLL VERSION</span>
      </label>
    </div>
  </div>

  <div class="status" id="status">Speed saved! ✓</div>

  <button class="permission-button" id="requestPermission">
    🔓 Instagram Access De
  </button>

  <div class="footer">Refresh Kr Instagram page to apply changes</div>

  <script src="popup.js"></script>
</body>
</html>
